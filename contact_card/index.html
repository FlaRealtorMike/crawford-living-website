<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael D. Crawford — Crawford Living Realty</title>
<meta name="description" content="Contact card for Michael D. Crawford, Broker / Owner, Crawford Living Realty, LLC.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/crawford.css">
<style>
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2.25rem 1.5rem;
  }
  .card{
    width:100%;
    max-width:22rem;
    text-align:center;
  }
  .card .photo{
    width:8.5rem;
    height:8.5rem;
    margin:0 auto 1.5rem;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:var(--lift-lg);
  }
  .card .photo img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .card .rule{
    width:2.5rem;
    height:2px;
    background:var(--accent);
    margin:0 auto 1.1rem;
    border:0;
  }
  .card h1{
    font-size:clamp(1.5rem,5vw,1.8rem);
    margin-bottom:.35rem;
  }
  .card .role{
    font-size:1rem;
    color:var(--muted);
    margin-bottom:.15rem;
  }
  .card .org{
    font-size:1rem;
    color:var(--ink);
    font-weight:500;
    margin-bottom:.9rem;
  }
  .card .license{
    font-family:var(--mono);
    font-size:.7rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:1.9rem;
  }
  .lines{
    list-style:none;
    margin:0 0 2rem;
    padding:0;
    border-top:1px solid var(--line);
  }
  .lines li{
    border-bottom:1px solid var(--line);
  }
  .lines a{
    display:block;
    padding:.95rem .25rem;
    text-decoration:none;
    color:var(--ink);
    font-size:1.02rem;
  }
  .lines a:hover{color:var(--muted)}
  .lines .k{
    display:block;
    font-family:var(--mono);
    font-size:.64rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:.2rem;
  }
  .save{width:100%;justify-content:center}
  .card .hint{
    font-family:var(--mono);
    font-size:.72rem;
    color:var(--muted);
    margin-top:1rem;
    margin-bottom:0;
  }
</style>
</head>
<body>

  <div class="card">
    <p class="photo"><img src="../assets/mike-crawford.jpg" alt="Michael D. Crawford"></p>

    <h1>Michael D. Crawford</h1>
    <p class="role">Broker / Owner</p>
    <p class="org">Crawford Living Realty, LLC</p>
    <p class="license">FL Lic. #CQ1075533</p>

    <ul class="lines">
      <li><a href="tel:+13214885542"><span class="k">Phone</span>321-488-5542</a></li>
      <li><a href="mailto:mdc@crawfordliving.com"><span class="k">Email</span>mdc@crawfordliving.com</a></li>
      <li><a href="https://www.crawfordliving.com"><span class="k">Website</span>www.crawfordliving.com</a></li>
    </ul>

    <a class="btn save" href="../assets/michael-crawford.vcf" download="Michael-Crawford-Crawford-Living.vcf">
      Save My Contact
    </a>
    <p class="hint">Adds Michael to your phone's contacts</p>
  </div>

</body>
</html>
