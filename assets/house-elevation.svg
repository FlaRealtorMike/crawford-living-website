<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-labelledby="he-t">
  <title id="he-t">Line drawing of a Florida porch house, one window lit</title>
  <defs>
    <linearGradient id="he-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C870" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E7C870" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#0E2A57" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <path d="M12 356 H648" stroke="#DACBA9" stroke-width="1.2"/>
    <path d="M40 340 H150 M510 340 H620" stroke="#DACBA9" stroke-width="1" stroke-dasharray="2 8"/>

    <!-- main roof -->
    <path d="M112 214 L330 96 L548 214" stroke-width="2.1"/>
    <path d="M134 214 L330 108 L526 214"/>

    <!-- gable face + vent -->
    <path d="M330 110 L140 214 H520 Z" fill="#FCF8EC" stroke="none"/>
    <path d="M140 214 L330 110 L520 214"/>
    <path d="M302 170 a28 28 0 0 1 56 0 v18 h-56 z" fill="#F2E9D5"/>
    <path d="M330 150 v38 M314 160 v28 M346 160 v28" stroke="#2A4877" stroke-width=".85"/>

    <!-- walls -->
    <rect x="176" y="214" width="308" height="122" fill="#FCF8EC" stroke="none"/>
    <path d="M176 214 V336 M484 214 V336" stroke-width="2"/>
    <path d="M176 336 H484" stroke-width="1.6"/>

    <!-- porch roof -->
    <path d="M92 262 H568" stroke-width="2.1"/>
    <path d="M92 262 L120 246 H540 L568 262"/>
    <path d="M100 270 H560" stroke="#2A4877" stroke-width=".8" opacity=".8"/>

    <!-- porch posts -->
    <path d="M132 270 V336 M244 270 V336 M416 270 V336 M528 270 V336" stroke-width="1.6"/>

    <!-- deck and steps -->
    <path d="M118 336 H542 M118 336 V346 H542 V336" stroke-width="1.5"/>
    <path d="M292 346 h76 v10 h-76 z" stroke-width="1.4"/>
    <path d="M276 356 h108" stroke-width="1.4"/>

    <!-- door -->
    <path d="M306 274 h48 v62 h-48 z" fill="#F2E9D5"/>
    <path d="M306 274 h48 v62 h-48 z"/>
    <path d="M316 284 h28 v20 h-28 z" stroke="#2A4877" stroke-width=".85"/>
    <circle cx="347" cy="314" r="2.3" fill="#0E2A57" stroke="none"/>

    <!-- windows -->
    <path d="M204 280 h56 v50 h-56 z" fill="#F2E9D5"/>
    <path d="M204 280 h56 v50 h-56 z"/>
    <path d="M232 280 v50 M204 305 h56" stroke="#2A4877" stroke-width=".85"/>

    <path d="M400 280 h56 v50 h-56 z" fill="url(#he-glow)" stroke="none"/>
    <path d="M400 280 h56 v50 h-56 z"/>
    <path d="M428 280 v50 M400 305 h56" stroke="#8A6D2F" stroke-width=".85"/>

    <!-- palms -->
    <g stroke-width="1.5">
      <path d="M62 356 C68 312 60 278 52 252"/>
      <path d="M52 252 C36 238 20 236 10 242 M52 252 C40 230 26 220 12 218 M52 252 C52 228 46 208 36 196 M52 252 C64 230 78 220 92 218 M52 252 C68 238 84 236 94 244 M52 252 C60 232 74 216 88 208"/>
    </g>
    <g stroke-width="1.4">
      <path d="M606 356 C600 322 608 296 616 276"/>
      <path d="M616 276 C604 264 590 260 580 264 M616 276 C608 258 596 248 584 246 M616 276 C618 256 614 240 606 230 M616 276 C628 260 640 252 652 252 M616 276 C632 266 646 266 654 272"/>
    </g>

    <!-- shrubs -->
    <g stroke="#2A4877" stroke-width="1.1">
      <path d="M74 356 q10 -20 22 -20 q12 0 20 20"/>
      <path d="M550 356 q10 -18 20 -18 q12 0 18 18"/>
    </g>
  </g>
</svg>
