# Tells Bing and other IndexNow search engines about the site's pages.
# Runs on every push to main, but waits for the GitHub Pages deploy to finish first,
# so the pages are live when pinged.
# Can also be run by hand: GitHub > Actions > IndexNow ping > Run workflow.
name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      HOST: crawfordliving.com
      KEY: 7b87339a695d90ffe81df5a3e8266759
    steps:
      - name: Wait for the GitHub Pages deploy of this commit to finish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            result=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pages-build-deployment \
              --commit "$GITHUB_SHA" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"' || true)
            echo "Pages deploy: ${result:-not started yet}"
            case "$result" in
              "completed success") exit 0 ;;
              "completed "*) echo "Pages deploy did not succeed; skipping ping"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Pages deploy"; exit 1
      - name: Send every sitemap URL to IndexNow
        run: |
          set -euo pipefail
          curl -fsS "https://$HOST/sitemap.xml" -o sitemap.xml
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' > urls.txt
          echo "URLs to submit:"; cat urls.txt
          jq -n --arg host "$HOST" --arg key "$KEY" \
            --arg keyLocation "https://$HOST/$KEY.txt" \
            --rawfile urls urls.txt \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:($urls | split("\n") | map(select(length>0)))}' > payload.json
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d @payload.json https://api.indexnow.org/indexnow)
          echo "IndexNow response: HTTP $code"
          cat response.txt
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then exit 1; fi
